<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Сад светлячков</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;font-family:Arial,sans-serif;background:#101e28;color:#fff}canvas{position:absolute;inset:0;width:100%;height:100%}.hud{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;z-index:2;font-size:18px;font-weight:bold}.pill{background:rgba(6,15,20,.7);border:2px solid rgba(255,255,255,.2);border-radius:18px;padding:10px 15px;backdrop-filter:blur(5px)}.screen{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(rgba(8,19,28,.65),rgba(8,19,28,.85));z-index:3;padding:22px;text-align:center}.card{width:min(420px,100%);background:#fff;color:#18232a;border-radius:28px;padding:28px 24px;box-shadow:0 25px 70px #0008}.moon{font-size:60px}.card h1{font-size:34px;margin:8px 0}.card p{font-size:19px;line-height:1.45;color:#58656b}.card button{border:0;border-radius:18px;background:#f5d53b;color:#172129;min-height:62px;width:100%;font-size:21px;font-weight:800;cursor:pointer;box-shadow:0 6px 0 #b99c14}.card button:active{transform:translateY(4px);box-shadow:0 2px 0 #b99c14}.hint{font-size:14px!important}.hidden{display:none}.basket{position:absolute;bottom:24px;left:50%;width:110px;height:45px;transform:translateX(-50%);border-radius:12px 12px 40px 40px;background:#e98f46;border:5px solid #7b4323;z-index:1;pointer-events:none}.basket:before{content:"";position:absolute;width:75px;height:45px;border:6px solid #7b4323;border-bottom:0;border-radius:50px 50px 0 0;left:12px;top:-38px}.controls{position:absolute;bottom:18px;left:14px;right:14px;display:flex;justify-content:space-between;z-index:2}.controls button{width:66px;height:66px;border-radius:50%;border:2px solid #fff8;background:#fff3;color:#172129;font-size:30px;font-weight:bold}.controls button:active{background:#f5d53b}@media(min-width:700px){.controls{display:none}.basket{bottom:20px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud hidden" id="hud"><div class="pill">✨ <span id="score">0</span> / 12</div><div class="pill">⏱ <span id="time">40</span></div></div>
<div class="basket hidden" id="basket"></div>
<div class="controls hidden" id="controls"><button data-dir="-1" aria-label="Влево">←</button><button data-dir="1" aria-label="Вправо">→</button></div>
<div class="screen" id="start"><div class="card"><div class="moon">🌙</div><h1>Сад светлячков</h1><p>Помоги собрать <b>12 светлячков</b>, пока не наступил рассвет.</p><button id="play">Начать игру</button><p class="hint">Двигай корзинку пальцем или стрелками</p></div></div>
<div class="screen hidden" id="finish"><div class="card"><div class="moon" id="finishIcon">🌟</div><h1 id="finishTitle">Как чудесно!</h1><p id="finishText"></p><button id="again">Сыграть ещё раз</button></div></div>
<script>
(()=>{const c=document.querySelector('#game'),x=c.getContext('2d'),hud=document.querySelector('#hud'),basketEl=document.querySelector('#basket'),controls=document.querySelector('#controls'),scoreEl=document.querySelector('#score'),timeEl=document.querySelector('#time');let w,h,dpr,items=[],stars=[],basketX=.5,score=0,time=40,last=0,spawn=0,running=false,keys={};function size(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:70},()=>({x:Math.random()*w,y:Math.random()*h*.8,r:Math.random()*1.7+.3,a:Math.random()}))}addEventListener('resize',size);size();function msg(event){parent.postMessage({type:'vibeplay:event',event,score},'*')}function start(){score=0;time=40;items=[];basketX=.5;last=performance.now();spawn=0;running=true;scoreEl.textContent=0;timeEl.textContent=40;document.querySelector('#start').classList.add('hidden');document.querySelector('#finish').classList.add('hidden');hud.classList.remove('hidden');basketEl.classList.remove('hidden');controls.classList.remove('hidden');msg('start');requestAnimationFrame(loop)}function end(win){running=false;hud.classList.add('hidden');basketEl.classList.add('hidden');controls.classList.add('hidden');document.querySelector('#finishIcon').textContent=win?'🌟':'🌅';document.querySelector('#finishTitle').textContent=win?'Как чудесно!':'Наступил рассвет';document.querySelector('#finishText').textContent=win?'Сад снова сияет. Ты собрала все светлячки!':`Собрано ${score} из 12. Попробуем ещё раз?`;document.querySelector('#finish').classList.remove('hidden');msg(win?'win':'lose')}function add(){items.push({x:30+Math.random()*(w-60),y:-20,r:13+Math.random()*5,v:45+Math.random()*38,t:Math.random()*6})}function loop(now){if(!running)return;let dt=Math.min((now-last)/1000,.04);last=now;time-=dt;spawn-=dt;if(spawn<=0){add();spawn=.65+Math.random()*.55}if(keys.ArrowLeft)basketX-=dt*.6;if(keys.ArrowRight)basketX+=dt*.6;basketX=Math.max(.1,Math.min(.9,basketX));let bx=basketX*w;basketEl.style.left=bx+'px';items.forEach(i=>{i.y+=i.v*dt;i.t+=dt*3});for(let i=items.length-1;i>=0;i--){let q=items[i];if(q.y>h-75&&q.y<h-20&&Math.abs(q.x-bx)<65){items.splice(i,1);score++;scoreEl.textContent=score;if(score>=12){draw();end(true);return}}else if(q.y>h+30)items.splice(i,1)}timeEl.textContent=Math.max(0,Math.ceil(time));draw();if(time<=0)end(false);else requestAnimationFrame(loop)}function draw(){let g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#102432');g.addColorStop(1,'#244836');x.fillStyle=g;x.fillRect(0,0,w,h);stars.forEach(s=>{x.globalAlpha=.35+s.a*.65;x.fillStyle='#fff9c9';x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill()});x.globalAlpha=1;x.fillStyle='#173a2c';for(let i=0;i<11;i++){let xx=i*w/10;x.beginPath();x.arc(xx,h+15,45+(i%3)*20,Math.PI,0);x.fill()}items.forEach(i=>{let glow=x.createRadialGradient(i.x,i.y,1,i.x,i.y,i.r*2.5);glow.addColorStop(0,'#fffbd1');glow.addColorStop(.25,'#f9dc4c');glow.addColorStop(1,'#f9dc4c00');x.fillStyle=glow;x.beginPath();x.arc(i.x,i.y,i.r*2.5,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(i.x,i.y,4,0,7);x.fill();x.strokeStyle='#fff9';x.lineWidth=2;x.beginPath();x.moveTo(i.x-3,i.y);x.quadraticCurveTo(i.x-18,i.y-12,i.x-15,i.y+4);x.moveTo(i.x+3,i.y);x.quadraticCurveTo(i.x+18,i.y-12,i.x+15,i.y+4);x.stroke()})}document.querySelector('#play').onclick=start;document.querySelector('#again').onclick=()=>{msg('restart');start()};addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault()});addEventListener('keyup',e=>keys[e.key]=false);addEventListener('pointermove',e=>{if(running)basketX=e.clientX/w});document.querySelectorAll('[data-dir]').forEach(b=>{let dir=+b.dataset.dir;b.onpointerdown=e=>{e.preventDefault();keys[dir<0?'ArrowLeft':'ArrowRight']=true};b.onpointerup=b.onpointercancel=()=>keys[dir<0?'ArrowLeft':'ArrowRight']=false});draw()})();
</script>
</body>
</html>
